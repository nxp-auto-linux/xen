kernel = "/boot/Image"

# Default value: 384MB of RAM (can be changed as needed)
memory = 384

name = "domu1"

# Number of VCPUs at boot time
vcpus = 1
vif = [ 'model=virtio-net,type=ioemu,bridge=xenbr0' ]
disk = [ 'phy:/dev/mmcblk0p5,xvda,backendtype=qdisk,specification=virtio' ]
extra = "console=hvc0 root=/dev/vda debug rw"
